<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookclub Logo</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f2ee;
      --ink: #111111;
      --muted: rgba(17, 17, 17, 0.42);
      --guide: rgba(17, 17, 17, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      width: min(82vw, 1120px);
      min-height: 100svh;
      place-items: center;
      padding: clamp(28px, 6vw, 80px);
    }

    #logo-stage {
      width: 100%;
    }

    .mode-dvd main {
      padding: 0;
      pointer-events: none;
    }

    .mode-dvd #logo-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(min(82vw, 1120px) - (2 * clamp(28px, 6vw, 80px)));
      will-change: transform;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    .mode-dynamic svg {
      cursor: pointer;
    }

    .cursor-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      padding: 5px 7px 4px;
      border: 1px solid var(--ink);
      background: var(--page);
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 0.06em;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      text-transform: uppercase;
      transform: translate(-100px, -100px);
      transition: opacity 120ms ease;
      user-select: none;
      white-space: nowrap;
    }

    .cursor-tooltip-visible .cursor-tooltip {
      opacity: 1;
    }

    path {
      fill: var(--ink);
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .sans {
      opacity: 0;
    }

    .sans,
    .serif {
      will-change: opacity;
    }

    .is-swapped .sans {
      opacity: 1;
    }

    .is-swapped .serif {
      opacity: 0;
    }

    .hit-area {
      fill: transparent;
      pointer-events: all;
    }

    .show-guides .hit-area {
      fill: var(--guide);
    }

    .mode-dynamic .hit-area {
      pointer-events: none;
    }

    .mode-selector {
      position: fixed;
      display: inline-flex;
      gap: 6px;
      right: clamp(18px, 4vw, 40px);
      bottom: clamp(16px, 3vw, 32px);
      z-index: 1;
      color: var(--muted);
    }

    .mode-selector button {
      display: grid;
      min-width: 0;
      height: 26px;
      margin: 0;
      place-items: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: 11px/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      padding: 0;
    }

    .mode-selector button[aria-pressed="true"] {
      color: var(--ink);
    }

    .scrub-control {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      height: 31px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-200px, -200px);
    }

    .mode-scrub .scrub-control {
      opacity: 1;
      pointer-events: auto;
    }

    .scrub-track {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--ink);
    }

    .scrub-handle {
      position: absolute;
      top: 8px;
      left: 0;
      width: 17px;
      height: 15px;
      border: 0;
      background: transparent;
      cursor: ew-resize;
      margin: 0;
      padding: 0;
      transform: translateX(-8px);
      touch-action: none;
    }

    .scrub-handle::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      width: 1px;
      height: 15px;
      background: var(--ink);
    }

    @media (max-width: 680px) {
      main {
        width: 100%;
        padding-inline: 20px;
      }

      .mode-selector {
        right: 16px;
        bottom: 14px;
      }

      .mode-dvd #logo-stage {
        width: calc(100vw - 40px);
      }

    }
  </style>
</head>
<body>
  <main>
    <div id="logo-stage" aria-label="Bookclub interactive logo"></div>
  </main>
  <div class="mode-selector" aria-label="Mode selector" role="group">
    <button type="button" data-mode="1" aria-pressed="true">DVD</button>
    <button type="button" data-mode="2" aria-pressed="false">Click</button>
    <button type="button" data-mode="3" aria-pressed="false">Hover</button>
    <button type="button" data-mode="4" aria-pressed="false">Scrub</button>
  </div>
  <div class="scrub-control" aria-hidden="true">
    <div class="scrub-track"></div>
    <button class="scrub-handle" type="button" aria-label="Scrub logo style"></button>
  </div>
  <div class="cursor-tooltip" aria-hidden="true">Wait for it</div>

  <script src="./sketch.js?v=dvd-first-1"></script>
</body>
</html>
