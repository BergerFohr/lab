<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookclub Logo</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f2ee;
      --ink: #111111;
      --muted: rgba(17, 17, 17, 0.42);
      --guide: rgba(17, 17, 17, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      width: min(82vw, 1120px);
      min-height: 100svh;
      place-items: center;
      padding: clamp(28px, 6vw, 80px);
    }

    #logo-stage {
      width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    path {
      fill: var(--ink);
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .sans {
      opacity: 0;
    }

    .sans,
    .serif {
      will-change: opacity;
    }

    .is-swapped .sans {
      opacity: 1;
    }

    .is-swapped .serif {
      opacity: 0;
    }

    .hit-area {
      fill: transparent;
      pointer-events: all;
    }

    .show-guides .hit-area {
      fill: var(--guide);
    }

    .mode-dynamic .hit-area {
      pointer-events: none;
    }

    .meta {
      position: fixed;
      right: clamp(18px, 4vw, 40px);
      bottom: clamp(16px, 3vw, 32px);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
    }

    @media (max-width: 680px) {
      main {
        width: 100%;
        padding-inline: 20px;
      }

      .meta {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div id="logo-stage" aria-label="Bookclub interactive logo"></div>
  </main>
  <div class="meta" aria-hidden="true">Mode <span id="mode-label">1</span></div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="/lab/bookclub-logo/sketch.js?v=2e82a4f"></script>
</body>
</html>
