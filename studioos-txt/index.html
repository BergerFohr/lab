<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B&F</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    width: 75vw;
    height: auto;
    display: block;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    opacity: 0.3;
    transition: opacity 0.3s;
  }
  .controls:hover { opacity: 1; }
  label {
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type=range] { width: 80px; accent-color: #f2f2f2; }
  input[type=text] {
    background: transparent;
    color: #f2f2f2;
    border: 1px solid #333;
    padding: 3px 6px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    width: 200px;
  }
  button {
    background: transparent;
    color: #888;
    border: 1px solid #333;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 10px;
  }
  button:hover { color: #f2f2f2; border-color: #666; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="controls">
  <label>text <input type="text" id="textInput" value="STUDIO OS "></label>
  <label>size <input type="range" id="sizeRange" min="4" max="28" value="4"> <span id="sizeVal">4px</span></label>
  <label>speed <input type="range" id="speedRange" min="1" max="20" value="6"> <span id="speedVal">6</span></label>
  <label><input type="checkbox" id="invertCheck"> invert</label>
  <button id="dlBtn">↓ png</button>
</div>

<script>
const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 88">

  <circle cx="436.05" cy="55" r="11"/>

</svg>`;

const SVG_ASPECT = 88 / 742; // h/w

let maskData = null;
let maskW = 0, maskH = 0;
let svgImg = null;
let charOffset = 0;
let frameCount = 0;
let animId = null;
let lastFontSize = null;
let cachedCharWidth = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Pre-load SVG image
function loadSVG() {
  return new Promise((res, rej) => {
    const blob = new Blob([SVG_SOURCE], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = rej;
    img.src = url;
  });
}

function buildMask(img, cw, ch) {
  const mc = new OffscreenCanvas(cw, ch);
  const mctx = mc.getContext('2d');
  mctx.drawImage(img, 0, 0, cw, ch);
  maskData = mctx.getImageData(0, 0, cw, ch).data;
  maskW = cw;
  maskH = ch;
}

function getCharWidth(fontSize) {
  if (lastFontSize === fontSize && cachedCharWidth !== null) return cachedCharWidth;
  ctx.font = `${fontSize}px "Courier New", monospace`;
  cachedCharWidth = ctx.measureText('M').width;
  lastFontSize = fontSize;
  return cachedCharWidth;
}

function draw() {
  const fontSize = parseInt(document.getElementById('sizeRange').value);
  const text = document.getElementById('textInput').value || 'STUDIO OS ';
  const invert = document.getElementById('invertCheck').checked;
  const speed = parseInt(document.getElementById('speedRange').value);

  const bg = invert ? '#f2f2f2' : '#000000';
  const fg = invert ? '#000000' : '#f2f2f2';

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!maskData) return;

  const lineHeight = Math.round(fontSize * 1.3);
  const charWidth = getCharWidth(fontSize);

  ctx.fillStyle = fg;
  ctx.font = `${fontSize}px "Courier New", monospace`;

  const numRows = Math.ceil(maskH / lineHeight);
  let totalCharsPlaced = 0;

  for (let row = 0; row < numRows; row++) {
    const scanY = Math.min(Math.floor(row * lineHeight + lineHeight * 0.5), maskH - 1);
    const textY = row * lineHeight + fontSize;
    let col = 0;

    for (let x = 0; x < maskW; x += charWidth, col++) {
      const px = Math.min(Math.floor(x), maskW - 1);
      const dataIdx = (scanY * maskW + px) * 4;
      const alpha = maskData[dataIdx + 3];

      if (alpha > 64) {
        const idx = (totalCharsPlaced + charOffset) % text.length;
        ctx.fillText(text[idx], x, textY);
        totalCharsPlaced++;
      }
    }
  }

  // Advance offset based on speed
  frameCount++;
  if (frameCount % Math.max(1, Math.round(12 / speed)) === 0) {
    charOffset = (charOffset + 1) % text.length;
  }

  animId = requestAnimationFrame(draw);
}

function resize() {
  if (!svgImg) return;
  // Canvas pixel dimensions: base on a high-res internal size
  // We'll use 2000px wide internally, CSS handles display size
  const internalW = 2000;
  const internalH = Math.round(internalW * SVG_ASPECT);

  canvas.width = internalW;
  canvas.height = internalH;

  buildMask(svgImg, internalW, internalH);
  lastFontSize = null; // invalidate cache
}

async function init() {
  svgImg = await loadSVG();
  resize();

  window.addEventListener('resize', () => {
    // No need to resize internal canvas, CSS handles responsiveness
    // But rebuild mask if needed
  });

  // Controls
  document.getElementById('sizeRange').addEventListener('input', function() {
    document.getElementById('sizeVal').textContent = this.value + 'px';
    lastFontSize = null;
  });
  document.getElementById('speedRange').addEventListener('input', function() {
    document.getElementById('speedVal').textContent = this.value;
  });
  document.getElementById('invertCheck').addEventListener('change', () => {});

  document.getElementById('dlBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'bf-text-art.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  draw();
}

init();
</script>
</body>
</html>
